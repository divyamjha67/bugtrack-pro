<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugTrack Pro</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="auth-view" class="auth-card card">
        <div class="brand-mark">BT</div>
        <p class="eyebrow">Team workspace</p>
        <h1>BugTrack Pro</h1>
        <p class="muted">Track bugs, ship fixes, and keep your team aligned.</p>
        <div class="tabs">
          <button class="tab active" data-mode="login">Sign in</button>
          <button class="tab" data-mode="register">Create account</button>
        </div>
        <form id="auth-form">
          <label id="name-label" class="hidden">Name<input id="name" type="text" /></label>
          <label>Email<input id="email" type="email" required /></label>
          <label>Password<input id="password" type="password" minlength="8" required /></label>
          <button class="primary full" type="submit" id="auth-submit">Sign in</button>
        </form>
        <p id="auth-message" class="message"></p>
      </section>

      <section id="app-view" class="hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">Team workspace</p>
            <h1>BugTrack Pro</h1>
          </div>
          <div class="user-actions"><span id="welcome"></span><button id="logout" class="ghost">Log out</button></div>
        </header>

        <section class="stats">
          <div class="stat card"><span>Open</span><strong id="open-count">0</strong></div>
          <div class="stat card"><span>In progress</span><strong id="progress-count">0</strong></div>
          <div class="stat card"><span>Testing</span><strong id="testing-count">0</strong></div>
          <div class="stat card"><span>Resolved</span><strong id="resolved-count">0</strong></div>
        </section>

        <section class="workspace">
          <div class="card issue-panel">
            <div class="section-heading"><div><p class="eyebrow">Delivery board</p><h2>Issues</h2></div><button id="new-issue" class="primary">+ New issue</button></div>
            <div class="filters"><input id="search" placeholder="Search issues..." /><select id="status-filter"><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="testing">Testing</option><option value="resolved">Resolved</option></select><select id="priority-filter"><option value="">All priorities</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div>
            <div id="issues" class="issue-list"><p class="muted">Loading issues...</p></div>
          </div>

          <aside id="issue-form-panel" class="card form-panel hidden">
            <div class="section-heading"><div><p class="eyebrow">Workspace action</p><h2 id="form-title">New issue</h2></div><button id="close-form" class="icon-button">×</button></div>
            <form id="issue-form">
              <input id="issue-id" type="hidden" />
              <label>Title<input id="issue-title" required minlength="3" maxlength="200" placeholder="Describe the issue" /></label>
              <label>Description<textarea id="issue-description" rows="6" placeholder="What happened? How can it be reproduced?"></textarea></label>
              <label>Priority<select id="issue-priority"><option value="critical">Critical</option><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
              <label>Assignee<select id="issue-assignee"><option value="">Unassigned</option></select></label>
              <label id="status-field" class="hidden">Status<select id="issue-status"><option value="open">Open</option><option value="in_progress">In progress</option><option value="testing">Testing</option><option value="resolved">Resolved</option></select></label>
              <button class="primary full" type="submit">Save issue</button>
            </form>
            <p id="issue-message" class="message"></p>
          </aside>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
